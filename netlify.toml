[build]
  command = "npm run build"
  publish = "dist"

# Security headers for production
[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy - prevents XSS attacks
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com cdn.jsdelivr.net data:; img-src 'self' data: https:; connect-src 'self' https://api.emailjs.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none';"
    
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Clickjacking protection
    X-Frame-Options = "DENY"
    
    # XSS protection for older browsers
    X-XSS-Protection = "1; mode=block"
    
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Permissions policy - disable unnecessary browser features
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    
    # HTTPS enforcement
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Redirect rules for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
